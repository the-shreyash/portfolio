<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Shreyash Yadav — AI Product Builder & Full-Stack Engineer</title>
    <meta
      name="description"
      content="Portfolio of Shreyash Yadav — AI product builder and full-stack engineer building intelligent digital products and immersive experiences."
    />
    <meta name="theme-color" content="#090a0f" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
